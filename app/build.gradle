plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

version = '0.4.3'

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(17))
    }
}

javafx {
    version = '21.0.4'
    modules = ['javafx.controls', 'javafx.media', 'javafx.web']
}

application {
    mainClass.set('de.danoeh.antennapod.desktop.Launcher')
}

dependencies {
    implementation project(':core')
    implementation 'net.java.dev.jna:jna:5.14.0'
    implementation 'net.java.dev.jna:jna-platform:5.14.0'
    testImplementation 'junit:junit:4.13.2'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    useJUnit()
    // The UI text the tests assert is the English bundle. Pin the test JVM's locale so the
    // result does not depend on the language of the machine running the build (CI runs en-US);
    // the app itself still follows the system language at runtime.
    systemProperty 'user.language', 'en'
    systemProperty 'user.country', 'US'
}

tasks.named('jar') {
    manifest {
        attributes('Implementation-Version': project.version)
    }
}

tasks.named('run') {
    jvmArgs = ['--enable-native-access=javafx.media']
    // gradlew :app:run -Pportable=<folder> runs on a separate profile (portable mode): library,
    // downloads and settings in that folder, leaving %APPDATA% and the registry alone
    if (project.hasProperty('portable')) {
        systemProperty 'antennapod.desktop.portable', file(project.property('portable')).absolutePath
    }
}
