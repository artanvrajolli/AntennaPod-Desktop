# User-visible text of AntennaPod Desktop, read through de.danoeh.antennapod.desktop.Messages.
#
# This file is UTF-8. To translate, copy it to messages_<language>.properties (for example
# messages_de.properties) next to it and translate the values; keys stay as they are.
#
# {0}, {1}, ... are filled in by the app. In values that have them, a literal apostrophe is
# written twice ('') as java.text.MessageFormat requires; values without placeholders are
# shown exactly as written.

