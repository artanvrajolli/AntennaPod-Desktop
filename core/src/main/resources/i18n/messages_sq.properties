# Tekstet që sheh përdoruesi në AntennaPod Desktop, të lexuara përmes de.danoeh.antennapod.desktop.Messages.
#
# Ky skedar është UTF-8. Për ta përkthyer, kopjojeni si messages_<language>.properties (për shembull
# messages_de.properties) pranë tij dhe përktheni vlerat; çelësat mbeten siç janë.
#
# {0}, {1}, ... plotësohen nga aplikacioni. Në vlerat që i përmbajnë, një apostrof i mirëfilltë
# shkruhet dy herë ('') siç e kërkon java.text.MessageFormat; vlerat pa vendmbajtës
# shfaqen saktësisht siç janë shkruar.

