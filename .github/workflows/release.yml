name: Build Windows release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew :core:test :app:test :app:installDist --console=plain

      - name: Read app version
        shell: pwsh
        run: |
          $version = (Select-String -Path app/build.gradle -Pattern "version = '([^']+)'").Matches.Groups[1].Value
          if (-not $version) { throw "Could not read app version from app/build.gradle" }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "App version $version"

      - name: Package portable zip and installer
        shell: pwsh
        run: ./packaging/windows/package.ps1 -Version $env:APP_VERSION

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AntennaPod-Desktop-Windows
          path: |
            AntennaPod-Desktop-Windows.zip
            AntennaPod-Desktop-Setup-*.exe

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            AntennaPod-Desktop-Setup-*.exe
            AntennaPod-Desktop-Windows.zip
          body: |
            AntennaPod Desktop for Windows (10/11, 64-bit).

            **Installer** — download `AntennaPod-Desktop-Setup-*.exe`, run it, and start
            AntennaPod Desktop from the Start menu. Per-user install, no admin rights needed.

            **Portable** — download `AntennaPod-Desktop-Windows.zip`, unzip anywhere and run
            `AntennaPod-Desktop.exe`.

            Your data (subscriptions, downloads, playback positions) lives in `%APPDATA%\AntennaPod`.
